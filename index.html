<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seabound Interactive</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #f0d060;
      --gold-dark: #8a6a1a;
      --white: #f0ede6;
      --muted: rgba(240,237,230,0.5);
    }

    html, body { height: 100%; overflow-x: hidden; }

    body {
      font-family: 'Raleway', sans-serif;
      color: var(--white);
      min-height: 100vh;
      background: #080a0d;
      
    }

    /* custom cursor */
    #cur  { position:fixed; width:10px; height:10px; background:var(--gold-light); pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:width .12s,height .12s; mix-blend-mode:difference; }
    #ring { position:fixed; width:38px; height:38px; border:1.5px solid var(--gold); pointer-events:none; z-index:9998; transform:translate(-50%,-50%); opacity:.55; transition:width .2s,height .2s,border-color .2s,opacity .2s; }
    body.hov #cur  { width:6px; height:6px; }
    body.hov #ring { width:56px; height:56px; border-color:var(--gold-light); opacity:1; }
    body.clk #cur  { transform:translate(-50%,-50%) scale(.4); }
    body.clk #ring { opacity:.2; width:70px; height:70px; }

    /* bg */
    .bg { position:fixed; inset:0; z-index:0; background-image:url('background.png'); background-size:cover; background-position:center; }
    .bg::after { content:''; position:absolute; inset:0; background:rgba(0,0,0,.6); }
    .bg::before { content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
      background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px); }

    .site { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

    /* nav */
    nav { display:flex; align-items:center; padding:1.4rem 2.2rem; gap:.85rem; }
    nav img { width:46px; height:46px; object-fit:contain; filter:drop-shadow(0 0 10px rgba(201,168,76,.5)); transition:transform .2s,filter .2s; }
    nav img:hover { transform:scale(1.1) rotate(-3deg); filter:drop-shadow(0 0 20px rgba(240,208,96,.9)); }
    .brand { font-family:'Cinzel',serif; font-size:.95rem; font-weight:700; letter-spacing:.14em; color:var(--gold-light); text-transform:uppercase; }

    /* hero */
    .hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4rem 1.5rem 6rem; }

    .eyebrow { font-size:.65rem; font-weight:600; letter-spacing:.45em; text-transform:uppercase; color:var(--gold); margin-bottom:1.4rem; opacity:0; animation:up .7s ease forwards .2s; }

    h1 { font-family:'Cinzel',serif; font-size:clamp(2.8rem,8vw,6.5rem); font-weight:900; line-height:1.05; letter-spacing:.04em; color:var(--white); text-shadow:0 2px 40px rgba(0,0,0,.7); opacity:0; animation:up .8s ease forwards .4s; margin-bottom:1.8rem; }
    h1 span { color:var(--gold-light); }

    .rule { width:64px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:0 auto 1.8rem; opacity:0; animation:up .6s ease forwards .65s; }

    .desc { max-width:540px; font-size:1.05rem; font-weight:300; line-height:1.85; color:var(--muted); opacity:0; animation:up .7s ease forwards .8s; margin-bottom:3.5rem; }
    .desc em { color:rgba(201,168,76,.5); font-style:normal; border-bottom:1px dashed rgba(201,168,76,.3); }

    /* CTA button */
    .cta-wrap { opacity:0; animation:up .7s ease forwards 1s; }

    .pulse-ring { display:inline-block; }

    .cta {
      display:inline-flex; align-items:center; gap:1rem;
      padding:1.15rem 3.2rem;
      font-family:'Cinzel',serif; font-size:.9rem; font-weight:900;
      letter-spacing:.22em; text-transform:uppercase;
      color:#080a0d; background:var(--gold-light);
      text-decoration:none; position:relative; 
      border:none; overflow:hidden;
      /* the "3D press" shadow */
      box-shadow: 0 6px 0 var(--gold-dark), 0 10px 28px rgba(201,168,76,.3);
      transition: box-shadow .07s, transform .07s, background .12s;
    }
    /* glint top */
    .cta::before { content:''; position:absolute; top:0; left:0; right:0; height:45%; background:linear-gradient(180deg,rgba(255,255,255,.28),transparent); pointer-events:none; }
    /* sweep flash */
    .cta::after { content:''; position:absolute; inset:0; background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.35) 50%,transparent 62%); transform:translateX(-120%); transition:transform .45s ease; pointer-events:none; }

    .cta:hover { background:#f8e070; transform:translateY(-3px); box-shadow:0 9px 0 var(--gold-dark), 0 16px 40px rgba(240,208,96,.5), 0 0 80px rgba(240,208,96,.15); }
    .cta:hover::after { transform:translateX(120%); }
    .cta:active { transform:translateY(5px); box-shadow:0 1px 0 var(--gold-dark), 0 4px 12px rgba(201,168,76,.25); }

    .cta svg { width:18px; height:18px; stroke:#080a0d; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s; }
    .cta:hover svg { transform:translateX(6px); }

    /* corners */
    .ctl,.cbr { position:fixed; width:80px; height:80px; z-index:1; opacity:.22; }
    .ctl { top:0; left:0; border-top:1px solid var(--gold); border-left:1px solid var(--gold); }
    .cbr { bottom:0; right:0; border-bottom:1px solid var(--gold); border-right:1px solid var(--gold); }

    footer { position:relative; z-index:1; text-align:center; padding:1.2rem; font-size:.68rem; letter-spacing:.14em; color:rgba(240,237,230,.18); text-transform:uppercase; }

    @keyframes up { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="ctl"></div><div class="cbr"></div>

  <div class="site">
    <nav>
      <img src="logo.png" alt="Seabound logo" />
      <span class="brand">Seabound Interactive</span>
    </nav>
    <main class="hero">
      <p class="eyebrow">Created by "Shipbloxxer" and "A Forgotten Studio"</p>
      <h1>Seabound<br/><span>Interactive</span></h1>
      <div class="rule"></div>
      <p class="desc">Games related to sinking ships or other maritime stuff.</p>
      <div class="cta-wrap">
        <span class="pulse-ring">
          <a href="games.html" class="cta">
            Explore Games
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
        </span>
      </div>
    </main>
    <footer>&copy; 2026 Seabound Interactive &mdash; All rights reserved</footer>
  </div>

  <script>
    const cur=document.getElementById('cur'),ring=document.getElementById('ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{
      mx=e.clientX;my=e.clientY;
      cur.style.left=mx+'px';cur.style.top=my+'px';
    });
    (function loop(){rx+=(mx-rx)*.13;ry+=(my-ry)*.13;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
    document.querySelectorAll('a,button,img').forEach(el=>{
      el.addEventListener('mouseenter',()=>document.body.classList.add('hov'));
      el.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));
    });
    document.addEventListener('mousedown',()=>document.body.classList.add('clk'));
    document.addEventListener('mouseup',()=>document.body.classList.remove('clk'));
  </script>
</body>
</html>
